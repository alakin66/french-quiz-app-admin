name: Release Admin Tool

# Builds the macOS (Apple Silicon) Admin Tool .dmg and publishes it as a
# GitHub Release whenever a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-aarch64:
    runs-on: macos-14   # Apple Silicon runner → native aarch64 build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-tool/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: admin-tool
        run: npm install

      - name: Build (Tauri, aarch64-apple-darwin)
        working-directory: admin-tool
        # tauri.conf.json sets macOS.signingIdentity "-" → the bundled .app is
        # ad-hoc signed during dmg creation (opens with right-click → Open).
        run: npm run build -- --target aarch64-apple-darwin

      - name: Verify ad-hoc signature
        run: |
          APP=$(find admin-tool/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -n1)
          echo "Verifying signature of: $APP"
          codesign --verify --verbose "$APP"
          codesign --display --verbose=2 "$APP" || true

      - name: Locate .dmg
        id: dmg
        run: |
          DMG=$(find admin-tool/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)
          if [ -z "$DMG" ]; then echo "No .dmg found"; exit 1; fi
          echo "Found dmg: $DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
