<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Français</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Fluent UI Icons -->
    <link href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/student.css?v=2">
</head>
<body>
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <div class="logo-container">
                <i class="ms-Icon ms-Icon--Education" aria-hidden="true"></i>
                <h1>Quiz de Français</h1>
            </div>
            <div class="score-display hidden" id="header-score">
                <span>Score: <strong id="current-score">0</strong></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main">
            
            <!-- Screen 1: Start Screen -->
            <section id="start-screen" class="screen active fade-in">
                <div class="welcome-card">
                    <h2>Bienvenue !</h2>
                    <p>Sélectionnez un quiz ci-dessous pour commencer à pratiquer votre français.</p>
                    
                    <div class="form-group">
                        <label for="quiz-select">Choisissez un quiz</label>
                        <select id="quiz-select">
                            <option value="" disabled selected>Chargement des quiz...</option>
                        </select>
                    </div>

                    <button id="start-btn" class="btn btn-primary btn-large" disabled>
                        <span>Commencer le Quiz</span>
                        <i class="ms-Icon ms-Icon--Play" aria-hidden="true"></i>
                    </button>
                    
                    <div id="loading-error" class="error-msg hidden">
                        <i class="ms-Icon ms-Icon--ErrorBadge" aria-hidden="true"></i>
                        <span>Échec du chargement des quiz. Veuillez contacter votre professeur.</span>
                    </div>
                </div>
            </section>

            <!-- Screen 2: Quiz View -->
            <section id="quiz-screen" class="screen hidden">
                <div class="quiz-card">
                    <div class="progress-container">
                        <div class="progress-header">
                            <div class="progress-text">Question <span id="current-question-num">1</span> sur <span id="total-questions-num">10</span></div>
                            <button id="exit-quiz-btn" class="btn btn-icon-only" title="Quitter le quiz">
                                <i class="ms-Icon ms-Icon--Cancel" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                    </div>

                    <h2 class="question-text" id="question-text">Chargement de la question...</h2>
                    
                    <!-- Dynamic UI Area for Question Inputs -->
                    <div id="answers-container" class="answers-container">
                        <!-- Populated by JS -->
                    </div>

                    <!-- Footer Area -->
                    <div class="card-footer">
                        <!-- Feedback Area -->
                        <div id="feedback-container" class="feedback-container hidden">
                            <div class="feedback-icon" id="feedback-icon"></div>
                            <p id="feedback-text" class="feedback-text"></p>
                        </div>

                        <div class="action-footer">
                            <button id="next-btn" class="btn btn-primary hidden">
                                <span>Suivant</span>
                                <i class="ms-Icon ms-Icon--Forward" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Screen 3: Results -->
            <section id="results-screen" class="screen hidden fade-in">
                <div class="results-card">
                    <div class="trophy-icon">
                        <i class="ms-Icon ms-Icon--Trophy2Solid" aria-hidden="true"></i>
                    </div>
                    <h2>Quiz Terminé !</h2>
                    <p class="score-text">Vous avez obtenu <strong id="final-score">0</strong> sur <strong id="final-total">0</strong></p>
                    
                    <!-- Mini Graph or Visual Feedback -->
                    <div class="score-circle">
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <path class="circle" id="score-circle-path"
                                stroke-dasharray="0, 100"
                                d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                            />
                            <text x="18" y="20.35" class="percentage" id="score-percentage">0%</text>
                        </svg>
                    </div>

                    <button id="return-btn" class="btn btn-secondary">
                        <i class="ms-Icon ms-Icon--Back" aria-hidden="true"></i>
                        <span>Retour au Menu Principal</span>
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- Load data self-contained -->
    <script src="data/quizzes.js?v=2"></script>
    <script src="js/student.js?v=2"></script>
</body>
</html>
