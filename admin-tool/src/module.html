<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Admin — Module</title>
    <link rel="stylesheet" href="admin-app.css">
    <style>
        .intro-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .quiz-name-link {
            font-weight: 600;
            color: var(--color-primary);
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font);
            font-size: 13px;
            padding: 0;
            text-align: left;
        }
        .quiz-name-link:hover { text-decoration: underline; }
        #new-quiz-row { display:flex; gap:8px; align-items:center; padding:12px 12px; border-top:1px solid var(--color-border); }
        #new-quiz-input { flex:1; }
        .intro-section { margin-bottom:24px; }
        .module-meta-section { display:flex; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
        .module-meta-section .form-group { flex:1; min-width:200px; margin-bottom:0; }
    </style>
</head>
<body>
<div class="app-layout">

    <!-- Header -->
    <header class="app-header">
        <div class="app-header-left">
            <a class="app-header-title" href="index.html">&#x1F4DA; Quiz Admin</a>
            <nav class="breadcrumb">
                <a href="index.html">Modules</a>
                <span class="breadcrumb-sep">&#x276F;</span>
                <span class="breadcrumb-current" id="bc-module">—</span>
            </nav>
        </div>
        <div class="app-header-actions">
            <button class="btn btn-ghost btn-sm" id="btn-export-module-json">Exporter Module</button>
            <a class="btn btn-ghost btn-sm" id="btn-header-back" href="index.html">&#x2190; Retour</a>
        </div>
    </header>

    <!-- Body -->
    <div class="app-body">

        <!-- Module name + description -->
        <div class="module-meta-section">
            <div class="form-group">
                <label for="module-name-input">Nom du module</label>
                <input type="text" id="module-name-input" class="form-control" placeholder="Nom du module">
            </div>
            <div class="form-group" style="flex:2">
                <label for="module-desc-input">Description</label>
                <input type="text" id="module-desc-input" class="form-control" placeholder="Description facultative">
            </div>
        </div>

        <!-- Introduction section -->
        <div class="card intro-section">
            <div class="card-header">
                <span class="card-title">&#x1F4CB; Introduction</span>
                <div class="intro-actions">
                    <button class="btn btn-primary btn-sm" id="btn-edit-intro">Éditer</button>
                    <button class="btn btn-secondary btn-sm" id="btn-import-intro-json">Importer Introduction</button>
                    <button class="btn btn-secondary btn-sm" id="btn-clear-intro">Effacer</button>
                </div>
            </div>
            <div class="card-body">
                <div class="intro-editor-toolbar hidden" id="intro-editor-toolbar">
                    <div class="intro-toolbar-left">
                        <button class="toolbar-fmt-btn" id="tb-bold" title="Gras"><b>B</b></button>
                        <button class="toolbar-fmt-btn" id="tb-italic" title="Italique"><i>I</i></button>
                        <button class="toolbar-fmt-btn" id="tb-underline" title="Soulign&#xE9;"><u>U</u></button>
                        <label class="toolbar-fmt-btn toolbar-color-wrap" title="Couleur du texte">
                            <span>A</span>
                            <input type="color" id="tb-color" value="#000000">
                        </label>
                    </div>
                    <div class="intro-toolbar-right">
                        <button class="btn btn-primary btn-sm" id="btn-save-intro-edit">Sauvegarder</button>
                        <button class="btn btn-secondary btn-sm" id="btn-cancel-intro-edit">Annuler</button>
                    </div>
                </div>
                <div class="intro-preview" id="intro-preview">
                    <span class="text-muted">Aucune introduction définie.</span>
                </div>
            </div>
        </div>

        <!-- Quiz list -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">&#x1F4DD; Quiz</span>
                <span id="quiz-count-badge" class="badge badge-primary">0</span>
                <button class="btn btn-secondary btn-sm" id="btn-import-quiz-json">Importer Quiz</button>
                <button class="btn btn-secondary btn-sm" id="btn-generate-quiz">&#x2728; Génère Quiz</button>
            </div>
            <div class="card-body" style="padding:0">
                <table class="data-table" id="quiz-table">
                    <thead>
                        <tr>
                            <th>Nom du quiz</th>
                            <th>Description</th>
                            <th class="text-center">Questions</th>
                            <th style="text-align:right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="quiz-tbody"></tbody>
                </table>
                <!-- New quiz row -->
                <div id="new-quiz-row">
                    <input type="text" id="new-quiz-input" class="form-control"
                        placeholder="Nom du nouveau quiz (ex : Basique)">
                    <button class="btn btn-primary btn-sm" id="btn-add-quiz">+ Ajouter Quiz</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Rename modal -->
<div class="modal-overlay hidden" id="rename-modal">
    <div class="modal">
        <div class="modal-title">Renommer le quiz</div>
        <div class="modal-body">
            <div class="form-group">
                <label for="rename-input">Nouveau nom</label>
                <input type="text" id="rename-input" class="form-control">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="rename-cancel">Annuler</button>
            <button class="btn btn-primary" id="rename-confirm">Renommer</button>
        </div>
    </div>
</div>

<script src="admin-app.js"></script>
<script>
var appData = {};
var moduleName = getParam('module');
var pendingRenameKey = null;
var introEditActive = false;
var savedRange = null;
var cachedSettings = {};

// ── Helpers ──────────────────────────────────────────────────
function getModule() { return appData[moduleName] || {}; }

function quizKeys() {
    return Object.keys(getModule()).filter(function(k) {
        return k !== '_intro' && k !== '_description' && k !== '_quizDescriptions';
    });
}

// ── Render quizzes ───────────────────────────────────────────
function renderQuizTable() {
    var tbody = document.getElementById('quiz-tbody');
    var keys = quizKeys();
    document.getElementById('quiz-count-badge').textContent = keys.length;

    if (keys.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">' +
            '<div class="empty-state" style="padding:30px 24px">' +
            '<div class="empty-state-title">Aucun quiz</div>' +
            '<div class="empty-state-desc">Ajoutez un quiz ci-dessous.</div>' +
            '</div></td></tr>';
        return;
    }

    tbody.innerHTML = keys.map(function(key) {
        var questions = getModule()[key] || [];
        var desc = ((getModule()._quizDescriptions || {})[key]) || '';
        var mJson = escHtml(JSON.stringify(moduleName));
        var kJson = escHtml(JSON.stringify(key));
        return '<tr data-key="' + escHtml(key) + '">' +
            '<td>' +
            '<button class="quiz-name-link"' +
            ' onclick="navTo(\'questions.html\', {module: ' + mJson + ', quiz: ' + kJson + '})">' +
            escHtml(key) + '</button></td>' +
            '<td class="text-muted" style="font-size:12px;max-width:260px">' + escHtml(desc) + '</td>' +
            '<td class="text-center"><span class="badge badge-muted">' + questions.length + '</span></td>' +
            '<td><div class="actions-col">' +
            '<button class="btn btn-secondary btn-sm"' +
            ' onclick="navTo(\'questions.html\', {module: ' + mJson + ', quiz: ' + kJson + '})">Questions</button>' +
            '<button class="btn btn-secondary btn-sm" onclick="testQuiz(' + kJson + ')">Tester</button>' +
            '<button class="btn btn-secondary btn-sm" onclick="copyQuizLink(' + kJson + ')">Copier le lien</button>' +
            '<button class="btn btn-secondary btn-sm" onclick="exportQuizJson(' + kJson + ')">Exporter</button>' +
            '<button class="btn btn-secondary btn-sm" onclick="openRename(' + kJson + ')">Renommer</button>' +
            '<button class="btn btn-danger btn-sm" onclick="deleteQuiz(' + kJson + ')">Supprimer</button>' +
            '</div></td></tr>';
    }).join('');
}

// ── Intro preview ────────────────────────────────────────────
function renderIntroPreview(html) {
    var preview = document.getElementById('intro-preview');
    if (!html || !html.trim()) {
        preview.innerHTML = '<span class="text-muted">Aucune introduction d\u00e9finie.</span>';
    } else {
        preview.innerHTML = html;
    }
}

// ── Save module ──────────────────────────────────────────────
async function saveModule() {
    var newName = document.getElementById('module-name-input').value.trim();
    var desc = document.getElementById('module-desc-input').value.trim();

    if (!newName) { toast('Le nom du module est requis.', 'error'); return; }

    if (newName !== moduleName) {
        if (appData[newName]) { toast('Un module avec ce nom existe d\u00e9j\u00e0.', 'error'); return; }
        appData[newName] = appData[moduleName];
        delete appData[moduleName];
        moduleName = newName;
        document.getElementById('bc-module').textContent = moduleName;
        var url = new URL(window.location.href);
        url.searchParams.set('module', moduleName);
        window.history.replaceState({}, '', url.toString());
    }

    appData[moduleName]._description = desc;
    await saveData(appData);
    toast('Module enregistr\u00e9.', 'success');
}

// ── Add quiz ─────────────────────────────────────────────────
async function addQuiz() {
    var input = document.getElementById('new-quiz-input');
    var name = input.value.trim();
    if (!name) { toast('Entrez un nom de quiz.', 'error'); return; }
    if (getModule()[name] !== undefined) { toast('Ce quiz existe d\u00e9j\u00e0.', 'error'); return; }
    appData[moduleName][name] = [];
    await saveData(appData);
    input.value = '';
    renderQuizTable();
    toast('Quiz "' + name + '" cr\u00e9\u00e9.', 'success');
}

// ── Delete quiz ──────────────────────────────────────────────
async function deleteQuiz(key) {
    var ok = await confirmModal('Supprimer le quiz \u00ab\u00a0' + escHtml(key) + '\u00a0\u00bb\u00a0?');
    if (!ok) return;
    delete appData[moduleName][key];
    var descs = appData[moduleName]._quizDescriptions;
    if (descs && descs[key] !== undefined) {
        delete descs[key];
    }
    await saveData(appData);
    renderQuizTable();
    toast('Quiz "' + key + '" supprim\u00e9.', 'success');
}

// ── Rename quiz ──────────────────────────────────────────────
function openRename(key) {
    pendingRenameKey = key;
    document.getElementById('rename-input').value = key;
    document.getElementById('rename-modal').classList.remove('hidden');
    setTimeout(function() { document.getElementById('rename-input').select(); }, 50);
}

async function confirmRename() {
    var newKey = document.getElementById('rename-input').value.trim();
    if (!newKey) { toast('Entrez un nom.', 'error'); return; }
    if (newKey === pendingRenameKey) { document.getElementById('rename-modal').classList.add('hidden'); return; }
    if (getModule()[newKey] !== undefined) { toast('Ce nom existe d\u00e9j\u00e0.', 'error'); return; }

    var questions = appData[moduleName][pendingRenameKey];
    var rebuilt = {};
    Object.entries(appData[moduleName]).forEach(function([k, v]) {
        if (k === pendingRenameKey) rebuilt[newKey] = questions;
        else rebuilt[k] = v;
    });
    appData[moduleName] = rebuilt;
    var descs = appData[moduleName]._quizDescriptions;
    if (descs && descs[pendingRenameKey] !== undefined) {
        descs[newKey] = descs[pendingRenameKey];
        delete descs[pendingRenameKey];
    }
    await saveData(appData);
    document.getElementById('rename-modal').classList.add('hidden');
    renderQuizTable();
    toast('Quiz renomm\u00e9 en "' + newKey + '".', 'success');
    pendingRenameKey = null;
}

// ── Clipboard ────────────────────────────────────────────────
function copyToClipboard(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
}

function copyQuizLink(key) {
    var repo = cachedSettings.githubRepo || '';
    var slashIdx = repo.indexOf('/');
    if (!repo || slashIdx === -1) {
        toast('Configurez le d\u00e9p\u00f4t GitHub dans les param\u00e8tres.', 'error');
        return;
    }
    var owner    = repo.slice(0, slashIdx);
    var repoName = repo.slice(slashIdx + 1);
    var fullKey  = moduleName + ' - ' + key;
    var query    = '?quiz=' + encodeURIComponent(moduleName)
                 + '&preselect=' + encodeURIComponent(fullKey);
    var url = 'https://' + owner + '.github.io/' + repoName + '/' + query;
    copyToClipboard(url);
    toast('Lien copi\u00e9\u00a0!', 'success');
}

// ── Test quiz ────────────────────────────────────────────────
async function testQuiz(key) {
    try {
        var jsContent = buildStudentJs(appData);
        await invokeCmd('write_quizzes_js', { content: jsContent });
        var fullKey = moduleName + ' - ' + key;
        var query = '?quiz=' + encodeURIComponent(moduleName)
                  + '&preselect=' + encodeURIComponent(fullKey);
        await invokeCmd('open_student_app', { query: query });
        toast('Application \u00e9tudiant ouverte.', 'info');
    } catch (e) {
        toast('Impossible d\'ouvrir l\'application \u00e9tudiant\u00a0: ' + String(e), 'error');
    }
}

// ── Editing lock ─────────────────────────────────────────────
function setEditingLock(locked) {
    var ids = [
        'btn-add-quiz',
        'new-quiz-input',
        'module-name-input',
        'module-desc-input',
        'btn-edit-intro',
        'btn-clear-intro'
    ];
    ids.forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.disabled = locked;
    });
    var back = document.getElementById('btn-header-back');
    if (back) back.classList.toggle('btn-disabled', locked);
    document.querySelectorAll('#quiz-tbody button').forEach(function(btn) {
        btn.disabled = locked;
    });
}

// ── Intro edit mode ──────────────────────────────────────────
function enterIntroEditMode() {
    if (introEditActive) return;
    introEditActive = true;
    var preview = document.getElementById('intro-preview');
    preview.classList.add('edit-mode');
    document.getElementById('intro-editor-toolbar').classList.remove('hidden');
    setEditingLock(true);
    applyIntroEditability();
    addRowActionColumn();
    injectActionCol(preview);
    if (!preview.querySelector('table')) {
        insertFirstRow('title-row');
    }
}

function exitIntroEditMode() {
    introEditActive = false;
    savedRange = null;
    var preview = document.getElementById('intro-preview');
    preview.classList.remove('edit-mode');
    preview.querySelectorAll('[contenteditable]').forEach(function(el) {
        el.removeAttribute('contenteditable');
        delete el.dataset.noFormat;
    });
    removeRowActionColumn();
    removeActionCol(preview);
    closeInsertMenu();
    document.getElementById('intro-editor-toolbar').classList.add('hidden');
    setEditingLock(false);
}

function injectActionCol(preview) {
    var colgroup = preview.querySelector('colgroup');
    if (!colgroup) return;
    var col = document.createElement('col');
    col.className = 'action-col';
    col.style.width = '52px';
    colgroup.appendChild(col);
}

function removeActionCol(preview) {
    var col = preview.querySelector('col.action-col');
    if (col) col.remove();
}

// ── Cell editability ─────────────────────────────────────────
function applyIntroEditability() {
    var preview = document.getElementById('intro-preview');
    preview.querySelectorAll('tr').forEach(function(tr) {
        var cells = tr.querySelectorAll('td, th');

        if (tr.classList.contains('blank-row')) {
            cells.forEach(function(c) { c.contentEditable = 'false'; });

        } else if (tr.classList.contains('section-header')) {
            cells.forEach(function(c) {
                c.contentEditable = 'true';
                c.dataset.noFormat = 'true';
            });

        } else if (tr.classList.contains('focus-point')) {
            cells.forEach(function(c) {
                c.contentEditable = 'true';
                if (c.tagName === 'TH') c.dataset.noFormat = 'true';
            });

        } else {
            cells.forEach(function(c) { c.contentEditable = 'true'; });
        }
    });
}

// ── Selection tracking and format commands ───────────────────
document.addEventListener('selectionchange', function() {
    if (!introEditActive) return;
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    var range = sel.getRangeAt(0);
    var preview = document.getElementById('intro-preview');
    if (preview.contains(range.commonAncestorContainer)) {
        savedRange = range.cloneRange();
    }
    updateToolbarState();
});

function restoreSelection() {
    if (!savedRange) return;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
}

function selectionInNoFormatCell() {
    var sel = window.getSelection();
    if (!sel || !sel.anchorNode) return false;
    var node = sel.anchorNode.nodeType === 3
        ? sel.anchorNode.parentElement
        : sel.anchorNode;
    var cell = node.closest('td[data-no-format], th[data-no-format]');
    return !!cell;
}

function applyFormat(cmd, value) {
    if (selectionInNoFormatCell()) return;
    restoreSelection();
    document.execCommand(cmd, false, value || null);
    updateToolbarState();
}

function updateToolbarState() {
    document.getElementById('tb-bold').classList.toggle('active',
        document.queryCommandState('bold'));
    document.getElementById('tb-italic').classList.toggle('active',
        document.queryCommandState('italic'));
    document.getElementById('tb-underline').classList.toggle('active',
        document.queryCommandState('underline'));
}

// ── Row management ───────────────────────────────────────────
function addRowActionColumn() {
    var preview = document.getElementById('intro-preview');
    preview.querySelectorAll('tr').forEach(function(tr) {
        tr.appendChild(makeActionCell());
    });
}

function removeRowActionColumn() {
    document.querySelectorAll('.row-action-cell').forEach(function(td) {
        td.remove();
    });
}

function makeActionCell() {
    var td = document.createElement('td');
    td.className = 'row-action-cell';
    td.contentEditable = 'false';
    td.innerHTML =
        '<button class="row-action-btn row-delete-btn"       title="Supprimer">&#x2715;</button>' +
        '<button class="row-action-btn row-insert-above-btn" title="Ins\u00e9rer au-dessus">&#x2191;</button>' +
        '<button class="row-action-btn row-insert-btn"       title="Ins\u00e9rer en-dessous">&#x2193;</button>';
    return td;
}

function showInsertMenu(tr, anchorBtn, direction) {
    closeInsertMenu();
    var menu = document.createElement('div');
    menu.id = 'row-insert-menu';
    menu.className = 'row-insert-menu';
    menu.innerHTML = [
        ['title-row',      'Titre (1 col, formattable)'],
        ['section-header', 'Section (1 col, non formattable)'],
        ['focus-point',    'Label + Contenu (2 col)'],
        ['explanation',    'Exemple (3 col)'],
        ['blank-row',      'Ligne vide'],
    ].map(function(pair) {
        return '<div class="row-insert-option" data-type="' + pair[0] + '">' + pair[1] + '</div>';
    }).join('');

    document.body.appendChild(menu);

    var rect = anchorBtn.getBoundingClientRect();
    menu.style.top   = (rect.bottom + 4) + 'px';
    menu.style.left  = 'auto';
    menu.style.right = (window.innerWidth - rect.right) + 'px';

    menu.querySelectorAll('.row-insert-option').forEach(function(opt) {
        opt.addEventListener('click', function(e) {
            e.stopPropagation();
            if (direction === 'before') {
                insertRowBefore(tr, opt.dataset.type);
            } else {
                insertRowAfter(tr, opt.dataset.type);
            }
            closeInsertMenu();
        });
    });

    setTimeout(function() {
        document.addEventListener('click', closeInsertMenu, { once: true });
    }, 0);
}

function closeInsertMenu() {
    var menu = document.getElementById('row-insert-menu');
    if (menu) menu.remove();
}

function buildNewRowElement(rowType) {
    var newTr = document.createElement('tr');
    newTr.className = rowType;

    if (rowType === 'title-row') {
        var tdTitle = document.createElement('td');
        tdTitle.setAttribute('colspan', '3');
        tdTitle.contentEditable = 'true';
        newTr.appendChild(tdTitle);

    } else if (rowType === 'section-header') {
        var tdSh = document.createElement('td');
        tdSh.setAttribute('colspan', '3');
        tdSh.contentEditable = 'true';
        tdSh.dataset.noFormat = 'true';
        newTr.appendChild(tdSh);

    } else if (rowType === 'focus-point') {
        var thFp = document.createElement('th');
        thFp.contentEditable = 'true';
        thFp.dataset.noFormat = 'true';
        var tdFp = document.createElement('td');
        tdFp.setAttribute('colspan', '2');
        tdFp.contentEditable = 'true';
        newTr.appendChild(thFp);
        newTr.appendChild(tdFp);

    } else if (rowType === 'explanation') {
        for (var i = 0; i < 3; i++) {
            var tdEx = document.createElement('td');
            tdEx.contentEditable = 'true';
            newTr.appendChild(tdEx);
        }

    } else if (rowType === 'blank-row') {
        var tdBl = document.createElement('td');
        tdBl.setAttribute('colspan', '3');
        tdBl.innerHTML = '&nbsp;';
        tdBl.contentEditable = 'false';
        newTr.appendChild(tdBl);
    }

    newTr.appendChild(makeActionCell());
    return newTr;
}

function insertRowAfter(tr, rowType) {
    tr.after(buildNewRowElement(rowType));
}

function insertRowBefore(tr, rowType) {
    tr.before(buildNewRowElement(rowType));
}

function insertFirstRow(rowType) {
    var preview = document.getElementById('intro-preview');
    preview.innerHTML = '';

    var table = document.createElement('table');
    table.className = 'xlsx-table intro-table';

    var colgroup = document.createElement('colgroup');
    ['33.33%', '33.33%', '33.34%'].forEach(function(w) {
        var col = document.createElement('col');
        col.style.width = w;
        colgroup.appendChild(col);
    });
    var actionCol = document.createElement('col');
    actionCol.className = 'action-col';
    actionCol.style.width = '52px';
    colgroup.appendChild(actionCol);

    var tbody = document.createElement('tbody');
    table.appendChild(colgroup);
    table.appendChild(tbody);
    preview.appendChild(table);

    tbody.appendChild(buildNewRowElement(rowType));
}

function resetToEmptyTitleRow(tr) {
    var actionCell = tr.querySelector('.row-action-cell');
    tr.className = 'title-row';
    tr.innerHTML = '';
    var td = document.createElement('td');
    td.setAttribute('colspan', '3');
    td.contentEditable = 'true';
    tr.appendChild(td);
    if (actionCell) tr.appendChild(actionCell);
}

// ── Paste stripping ──────────────────────────────────────────
function cleanPasteNode(node) {
    var KEEP_INLINE = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, BR: 1 };
    var BLOCK_TAGS  = { P: 1, DIV: 1, H1: 1, H2: 1, H3: 1, H4: 1, H5: 1,
                        H6: 1, LI: 1, UL: 1, OL: 1, BLOCKQUOTE: 1, PRE: 1 };
    var i = node.childNodes.length;
    while (i--) {
        var child = node.childNodes[i];
        if (child.nodeType !== 1) continue;
        var tag = child.tagName;
        if (BLOCK_TAGS[tag] || tag === 'FONT') {
            cleanPasteNode(child);
            var frag = document.createDocumentFragment();
            while (child.firstChild) frag.appendChild(child.firstChild);
            if (BLOCK_TAGS[tag]) frag.appendChild(document.createElement('br'));
            node.replaceChild(frag, child);
        } else if (KEEP_INLINE[tag]) {
            while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
            cleanPasteNode(child);
        } else if (tag === 'SPAN') {
            var style = child.getAttribute('style') || '';
            var colorMatch = style.match(/color\s*:\s*([^;]+)/);
            while (child.attributes.length > 0) child.removeAttribute(child.attributes[0].name);
            if (colorMatch) child.setAttribute('style', 'color:' + colorMatch[1].trim());
            cleanPasteNode(child);
            if (!child.getAttribute('style')) {
                var frag2 = document.createDocumentFragment();
                while (child.firstChild) frag2.appendChild(child.firstChild);
                node.replaceChild(frag2, child);
            }
        } else {
            cleanPasteNode(child);
            var frag3 = document.createDocumentFragment();
            while (child.firstChild) frag3.appendChild(child.firstChild);
            node.replaceChild(frag3, child);
        }
    }
}

function stripPastedHtml(html) {
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    cleanPasteNode(tmp);
    while (tmp.lastChild && tmp.lastChild.nodeName === 'BR') {
        tmp.removeChild(tmp.lastChild);
    }
    return tmp.innerHTML;
}

// ── Save / cancel ────────────────────────────────────────────
async function saveIntroEdit() {
    var preview = document.getElementById('intro-preview');
    var clone = preview.cloneNode(true);

    clone.querySelectorAll('[contenteditable]').forEach(function(el) {
        el.removeAttribute('contenteditable');
        el.removeAttribute('data-no-format');
    });
    clone.querySelectorAll('.row-action-cell').forEach(function(td) {
        td.remove();
    });
    var actionColClone = clone.querySelector('col.action-col');
    if (actionColClone) actionColClone.remove();

    appData[moduleName]._intro = clone.innerHTML;
    exitIntroEditMode();
    await saveData(appData);
    toast('Introduction sauvegard\u00e9e.', 'success');
}

function cancelIntroEdit() {
    renderIntroPreview(appData[moduleName]._intro || '');
    exitIntroEditMode();
}

// ── JSON export/import ───────────────────────────────────────
function exportModuleJson() {
    var safeName = moduleName.replace(/[^a-zA-Z0-9_\-]/g, '_');
    invokeCmd('save_named_json_dialog', { name: safeName + '.module.json' }).then(function(path) {
        if (!path) return;
        var payload = {};
        payload[moduleName] = appData[moduleName];
        invokeCmd('write_text_file_at', { path: path, content: JSON.stringify(payload, null, 2) })
            .then(function() { toast('Module export\u00e9.', 'success'); })
            .catch(function(e) { toast('Erreur export\u00a0: ' + String(e), 'error'); });
    });
}

function exportQuizJson(key) {
    var safeMod  = moduleName.replace(/[^a-zA-Z0-9_\-]/g, '_');
    var safeQuiz = key.replace(/[^a-zA-Z0-9_\-]/g, '_');
    invokeCmd('save_named_json_dialog', { name: safeMod + '-' + safeQuiz + '.quizz.json' }).then(function(path) {
        if (!path) return;
        var payload = {};
        payload[moduleName] = {};
        payload[moduleName][key] = (appData[moduleName] || {})[key] || [];
        invokeCmd('write_text_file_at', { path: path, content: JSON.stringify(payload, null, 2) })
            .then(function() { toast('Quiz \u00ab\u00a0' + key + '\u00a0\u00bb export\u00e9.', 'success'); })
            .catch(function(e) { toast('Erreur export\u00a0: ' + String(e), 'error'); });
    });
}

async function importIntroFromJson() {
    var path = await invokeCmd('open_json_dialog');
    if (!path) return;
    var text = await invokeCmd('read_text_file_at', { path: path });
    var incoming;
    try { incoming = JSON.parse(text); } catch (e) { toast('JSON invalide\u00a0: ' + e.message, 'error'); return; }

    var modules = Object.keys(incoming);
    if (modules.length === 0) { toast('Fichier vide.', 'error'); return; }

    var preselect = incoming[moduleName] !== undefined ? moduleName : modules[0];
    var chosen = await selectModal('Choisir le module source de l\u2019introduction\u00a0:', modules, preselect);
    if (!chosen) return;

    var intro = (incoming[chosen] || {})._intro || '';
    if (!intro) { toast('Aucune introduction trouv\u00e9e dans ce module.', 'error'); return; }

    appData[moduleName]._intro = intro;
    await saveData(appData);
    renderIntroPreview(intro);
    toast('Introduction import\u00e9e depuis \u00ab\u00a0' + chosen + '\u00a0\u00bb.', 'success');
}

async function importQuizFromJson() {
    var path = await invokeCmd('open_json_dialog');
    if (!path) return;
    var text = await invokeCmd('read_text_file_at', { path: path });
    var incoming;
    try { incoming = JSON.parse(text); } catch (e) { toast('JSON invalide\u00a0: ' + e.message, 'error'); return; }

    var modules = Object.keys(incoming);
    if (modules.length === 0) { toast('Fichier vide.', 'error'); return; }

    var modPreselect = incoming[moduleName] !== undefined ? moduleName : modules[0];
    var srcModule = await selectModal('Choisir le module source\u00a0:', modules, modPreselect);
    if (!srcModule) return;

    var quizzes = Object.keys(incoming[srcModule] || {}).filter(function(k) {
        return k !== '_intro' && k !== '_description' && k !== '_quizDescriptions';
    });
    if (quizzes.length === 0) { toast('Aucun quiz dans ce module.', 'error'); return; }

    var srcQuiz = await selectModal('Choisir le quiz \u00e0 importer\u00a0:', quizzes, quizzes[0]);
    if (!srcQuiz) return;

    var destKey = srcQuiz.startsWith(srcModule + ' - ')
        ? srcQuiz.slice(srcModule.length + 3)
        : srcQuiz;

    if (appData[moduleName] && appData[moduleName][destKey] !== undefined) {
        var ok = await confirmModal('Le quiz <strong>' + escHtml(destKey) + '</strong> existe d\u00e9j\u00e0. Le remplacer\u00a0?');
        if (!ok) return;
    }

    appData[moduleName][destKey] = incoming[srcModule][srcQuiz];
    await saveData(appData);
    renderQuizTable();
    toast('Quiz \u00ab\u00a0' + destKey + '\u00a0\u00bb import\u00e9.', 'success');
}

// ── Init ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async function() {
    if (!moduleName) { toast('Module non sp\u00e9cifi\u00e9.', 'error'); return; }

    appData = await loadData();
    if (!appData[moduleName]) {
        appData[moduleName] = { _description: '', _intro: '' };
    }

    try {
        var rawSettings = await invokeCmd('read_settings');
        cachedSettings = JSON.parse(rawSettings || '{}');
    } catch (e) {
        cachedSettings = {};
    }

    document.getElementById('bc-module').textContent = moduleName;
    document.title = 'Quiz Admin \u2014 ' + moduleName;
    document.getElementById('module-name-input').value = moduleName;
    document.getElementById('module-desc-input').value = appData[moduleName]._description || '';
    renderIntroPreview(appData[moduleName]._intro || '');
    renderQuizTable();

    document.getElementById('module-name-input').addEventListener('blur', saveModule);
    document.getElementById('module-desc-input').addEventListener('blur', saveModule);

    document.getElementById('btn-export-module-json').addEventListener('click', exportModuleJson);
    document.getElementById('btn-import-intro-json').addEventListener('click', importIntroFromJson);
    document.getElementById('btn-import-quiz-json').addEventListener('click', importQuizFromJson);
    document.getElementById('btn-generate-quiz').addEventListener('click', function() {
        navTo('generate-quiz.html', { module: moduleName });
    });

    document.getElementById('btn-add-quiz').addEventListener('click', addQuiz);
    document.getElementById('new-quiz-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') addQuiz();
    });

    document.getElementById('btn-edit-intro').addEventListener('click', enterIntroEditMode);
    document.getElementById('btn-save-intro-edit').addEventListener('click', saveIntroEdit);
    document.getElementById('btn-cancel-intro-edit').addEventListener('click', cancelIntroEdit);

    document.getElementById('tb-bold').addEventListener('mousedown', function(e) {
        e.preventDefault();
        applyFormat('bold');
    });
    document.getElementById('tb-italic').addEventListener('mousedown', function(e) {
        e.preventDefault();
        applyFormat('italic');
    });
    document.getElementById('tb-underline').addEventListener('mousedown', function(e) {
        e.preventDefault();
        applyFormat('underline');
    });
    document.getElementById('tb-color').addEventListener('change', function(e) {
        applyFormat('foreColor', e.target.value);
    });

    document.getElementById('intro-preview').addEventListener('keydown', function(e) {
        if (!introEditActive) return;
        if (e.key === 'Enter') {
            e.preventDefault();
            if (selectionInNoFormatCell()) return;
            document.execCommand('insertLineBreak');
        }
    });

    document.getElementById('intro-preview').addEventListener('paste', function(e) {
        if (!introEditActive) return;
        e.preventDefault();
        var html = (e.clipboardData || window.clipboardData).getData('text/html');
        var text = (e.clipboardData || window.clipboardData).getData('text/plain');
        var cleaned;
        if (html) {
            cleaned = stripPastedHtml(html);
        } else {
            var lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            cleaned = lines.map(function(line) { return escHtml(line); }).join('<br>');
        }
        if (cleaned) document.execCommand('insertHTML', false, cleaned);
    });

    document.getElementById('intro-preview').addEventListener('click', function(e) {
        if (!introEditActive) return;
        var delBtn = e.target.closest('.row-delete-btn');
        if (delBtn) {
            var tr = delBtn.closest('tr');
            var tbody = tr.closest('tbody');
            if (tbody && tbody.querySelectorAll('tr').length === 1) {
                resetToEmptyTitleRow(tr);
            } else {
                tr.remove();
            }
            return;
        }
        var aboveBtn = e.target.closest('.row-insert-above-btn');
        if (aboveBtn) {
            e.stopPropagation();
            showInsertMenu(aboveBtn.closest('tr'), aboveBtn, 'before');
            return;
        }
        var insBtn = e.target.closest('.row-insert-btn');
        if (insBtn) {
            e.stopPropagation();
            showInsertMenu(insBtn.closest('tr'), insBtn, 'after');
        }
    });

    document.getElementById('btn-clear-intro').addEventListener('click', async function() {
        var ok = await confirmModal('Effacer l\'introduction de ce module\u00a0?');
        if (!ok) return;
        appData[moduleName]._intro = '';
        renderIntroPreview('');
        await saveData(appData);
        toast('Introduction effac\u00e9e.', 'success');
    });

    document.getElementById('rename-confirm').addEventListener('click', confirmRename);
    document.getElementById('rename-cancel').addEventListener('click', function() {
        document.getElementById('rename-modal').classList.add('hidden');
        pendingRenameKey = null;
    });
    document.getElementById('rename-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') confirmRename();
    });
});
</script>
